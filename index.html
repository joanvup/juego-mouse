<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mouse Aventura: Pequeños Exploradores</title>
  <meta name="description" content="Juego educativo para aprender a usar el mouse. Primer grado de primaria. 100 niveles, 10 mundos y diploma final.">
  <meta name="theme-color" content="#176fb8">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    /* En file:// el navegador bloquea el manifiesto por CORS. Se retira para
       mantener la consola limpia; la PWA solo aplica cuando hay servidor. */
    if (location.protocol === 'file:') {
      var mf = document.querySelector('link[rel="manifest"]');
      if (mf) mf.parentNode.removeChild(mf);
    }
  </script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/game.css">
  <link rel="stylesheet" href="styles/play.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
</head>

  <a class="skip-link" href="#app">Saltar al contenido</a>

  <noscript>

      <h1>Mouse Aventura necesita JavaScript</h1>
